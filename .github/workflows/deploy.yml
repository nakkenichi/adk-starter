name: Deploy

# Pull requests: always verify that the Dockerfile builds (no GCP needed), then dry-run the
# deployment once GCP is bootstrapped. Pushes to main: deploy for real via scripts/deploy.sh.
# DEPLOYMENT_TARGET (repository variable) selects agent_runtime (default) or cloud_run.

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".gcloudignore"
      - "pyproject.toml"
      - "uv.lock"
      - "agents-cli-manifest.yaml"
      - "app/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".gcloudignore"
      - "pyproject.toml"
      - "uv.lock"
      - "agents-cli-manifest.yaml"
      - "app/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  container-build:
    name: Container Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container image
        run: |
          docker build \
            --build-arg AGENT_VERSION="$(git rev-parse --short HEAD)" \
            --tag agent:ci \
            .

  deploy:
    name: Deploy
    # Skips cleanly until `make bootstrap` has set the GCP repository variables, and for
    # pull requests from forks or Dependabot (they cannot mint an OIDC token for this
    # repository).
    if: >-
      vars.GCP_WIF_PROVIDER != '' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_TARGET: ${{ vars.DEPLOYMENT_TARGET || 'agent_runtime' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || github.event.repository.name }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO }}
      LOGS_BUCKET_NAME: ${{ vars.LOGS_BUCKET_NAME }}
      EXPORTS_BUCKET_NAME: ${{ vars.EXPORTS_BUCKET_NAME }}
      GEMINI_ENTERPRISE_APP_ID: ${{ vars.GEMINI_ENTERPRISE_APP_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CICD_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: "0.12.5"
          python-version: "3.12"

      # Agent Runtime builds the Dockerfile remotely from the source upload, so only Cloud Run
      # needs an image in Artifact Registry.
      - name: Build and push image (Cloud Run)
        if: env.DEPLOYMENT_TARGET == 'cloud_run' && github.event_name != 'pull_request'
        run: |
          registry="${GCP_REGION}-docker.pkg.dev"
          image_uri="${registry}/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE_NAME}:${GITHUB_SHA}"
          gcloud auth configure-docker "${registry}" --quiet
          docker build --build-arg AGENT_VERSION="$(git rev-parse --short HEAD)" \
            --tag "${image_uri}" .
          docker push "${image_uri}"
          echo "IMAGE_URI=${image_uri}" >> "${GITHUB_ENV}"

      - name: Validate deployment (dry run)
        if: github.event_name == 'pull_request'
        run: ./scripts/deploy.sh --dry-run

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: ./scripts/deploy.sh
