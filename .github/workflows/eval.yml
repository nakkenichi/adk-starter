name: Nightly Evaluation

# Runs the agent locally against the eval dataset (live Gemini on Vertex AI) and grades the
# traces with the Vertex AI evaluation service. Skips until `make bootstrap` has wired GCP.

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC
  workflow_dispatch:
    inputs:
      dataset:
        description: "Path to the evaluation dataset JSON"
        required: false
        default: "tests/eval/datasets/basic-dataset.json"
      config:
        description: "Path to the evaluation metrics config"
        required: false
        default: "tests/eval/eval_config.yaml"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly-eval:
    name: Agent Evaluation
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # Inputs flow through env (never `${{ }}` inside run:) to rule out script injection.
      DATASET: ${{ inputs.dataset || 'tests/eval/datasets/basic-dataset.json' }}
      EVAL_CONFIG: ${{ inputs.config || 'tests/eval/eval_config.yaml' }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_GENAI_USE_VERTEXAI: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.5"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra eval

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CICD_SA }}

      - name: Run evaluation
        run: |
          uvx google-agents-cli==1.5.0 eval run \
            --dataset "${DATASET}" \
            --config "${EVAL_CONFIG}" \
            --project "${GOOGLE_CLOUD_PROJECT}" \
            --output artifacts/grade_results

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
