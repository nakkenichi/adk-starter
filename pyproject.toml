[project]
name = "adk-starter"
version = "0.1.0"
description = "ADK Starter — Google ADK multi-agent application on Vertex AI Agent Runtime or Cloud Run"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk[gcp,otel-gcp]>=2.8.0,<3.0.0",
    "google-genai>=1.68.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0,<2.0.0",
    "google-cloud-storage>=3.1.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0.0,<2.0.0",
    "aiohttp>=3.13.4",
    "pydantic>=2.13.0",
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.42.0",
    "python-dotenv>=1.0.0",
    "protobuf>=6.31.1,<7.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12",
    "pathspec>=0.12.1",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.8.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Resolve every package from public PyPI so uv.lock stays portable across CI and Docker builds.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "google.cloud",
    "google.cloud.*",
    "google.auth",
    "google.auth.*",
    "grpc",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast offline unit tests with mocked LLM and zero network calls",
    "eval: live Vertex AI evaluation tests run in scheduled nightly workflows",
]

[tool.coverage.run]
source = ["app", "scripts"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
